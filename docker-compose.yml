version: '3.9'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clamsentinel
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U scanner -d clamsentinel" ]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"

  backend:
    build: ./backend
    environment:
      CLAMSENTINEL_DATABASE_URL: postgresql+psycopg://scanner:change_me@postgres:5432/clamsentinel
      CLAMSENTINEL_CLAMAV_HOST: clamav
      CLAMSENTINEL_CLAMAV_PORT: 3310
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

volumes:
  postgres_data:
